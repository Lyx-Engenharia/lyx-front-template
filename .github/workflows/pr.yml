name: PR Validation

# CI deste repo. Não é o modelo dos fronts: o pr.yml de um front está em
# consumidor/pr.yml.
#
# Não há mais dogfood do reusable aqui: o app de exemplo saiu e este repo não
# tem front para auditar. O lyx-audit.yml é coberto pelo catraca-tests, que roda
# os passos de verdade e simula o job inteiro (if:, outputs e status final).
# Para rodar uma mudança dele de verdade antes do merge, aponte o pr.yml de um
# front para a branch (`uses: ...lyx-audit.yml@<branch>`) numa PR de teste.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agents-sync-check:
    # Garante que AGENTS.md foi propagado pros mirrors via `npm run sync-agents`.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Check AGENTS.md sync
        run: |
          npm run sync-agents
          if [ -n "$(git status --porcelain CLAUDE.md .cursorrules .github/copilot-instructions.md)" ]; then
            echo "::error::AGENTS.md está dessincronizado. Rode 'npm run sync-agents' localmente e commite."
            git diff CLAUDE.md .cursorrules .github/copilot-instructions.md
            exit 1
          fi
          echo "AGENTS.md sync OK"

  catraca-tests:
    # Testes dos scripts da catraca do lyx-audit.yml (.github/lyx-audit/), com
    # fixtures sintéticos de um front com dívida (formato real do ESLint, do
    # vitest e do git; caminhos, nomes e números inventados), e do próprio
    # lyx-audit.yml: o passo do status final, o passo do lume e o job inteiro
    # simulado. node:test puro; o npm ci traz o ESLint que o teste de ponta a
    # ponta do lint usa.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Testes da catraca
        run: npm run test:catraca

  front-audit:
    # O pacote @lyxai/front-audit que os fronts instalam (eslint, preset do
    # dependency-cruiser, exclude do vitest e os bins do gate e do relatório).
    # O npm ci já builda o pacote (script prepare); o build explícito deixa o
    # erro de build no passo dele.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Typecheck do @lyxai/front-audit
        run: npm run typecheck:front-audit
      - name: Build do @lyxai/front-audit
        run: npm run build:front-audit
      - name: Testes do @lyxai/front-audit
        run: npm run test:front-audit

  sistema-admin:
    # O pacote @lyxai/sistema-admin (painel Admin de Sistema e perfil) que os
    # fronts instalam. O npm ci builda o pacote (script prepare); aqui rodam os
    # testes dele (vitest com jsdom).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Testes do @lyxai/sistema-admin
        run: npm run test:sistema-admin
